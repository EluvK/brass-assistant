[package]
name = "brass-engine"
version = "0.1.0"
edition = "2024"
description = "Brass: Birmingham game engine (Rust) - phase 1"

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.10.2", features = ["serde", "sys_rng"]}
rand_chacha = { version = "0.10.0", features = ["serde"] }
rand_distr = "0.6.0"
rayon = "1.10"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
numpy = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
base64 = { version = "0.22", optional = true }

[features]
default = []
python = ["dep:base64", "dep:numpy", "dep:pyo3"]

[[bin]]
name = "replay_web"
path = "src/bin/replay_web.rs"

[[bin]]
name = "train_bench"
path = "src/bin/train_bench.rs"
required-features = ["python"]
