[package]
name = "brass-engine"
version = "0.1.0"
edition = "2024"
description = "Brass: Birmingham game engine (Rust) - phase 1"

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.10.2", features = ["serde", "sys_rng"]}
rand_chacha = { version = "0.10.0", features = ["serde"] }
rand_distr = "0.6.0"
rayon = "1.10"
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
