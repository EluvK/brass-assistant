<!doctype html>
<meta charset="utf-8">
<title>Brass Replay</title>

<style>
:root {
  --ink:#17252b;
  --muted:#68767a;
  --line:#c8d2cf;
  --paper:#fbfcfa;
  --paper2:#f1f6f3;
  --teal:#174751;
  --teal2:#225c65;
  --accent:#1b806b;
  --rail:#5f6b70;
  --canal:#4b9aa1;
  --p0:#c23b3b;
  --p1:#3278b8;
  --p2:#bd7b24;
  --p3:#7356a5;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:#e8eeeb;
  color:var(--ink);
  font:13px system-ui,-apple-system,"Segoe UI",sans-serif;
}

.top {
  height:58px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--teal);
  color:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}

.top h1 {
  margin:0 14px 0 0;
  font-size:17px;
  letter-spacing:.2px;
}

.top button {
  padding:6px 11px;
  border:1px solid #abc0c2;
  border-radius:4px;
  background:#fff;
  color:var(--teal);
  font-weight:600;
  cursor:pointer;
  transition:.12s;
}

.top button:hover {
  background:#e8f1ef;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.top button:active { transform:translateY(1px); }
.top button:disabled { opacity:.55; cursor:not-allowed; box-shadow:none; }

.meta {
  margin-left:auto;
  color:#d5e3e0;
  font-size:12px;
}

.layout {
  display:grid;
  grid-template-columns:200px 165px minmax(560px,1.7fr) minmax(340px,.95fr);
  grid-template-rows:minmax(0,1fr);
  height:calc(100vh - 58px);
  gap:1px;
  background:#b8c4c0;
}

.panel {
  padding:12px;
  overflow:auto;
  background:var(--paper);
}

.timeline { grid-column:1; }
.right { grid-column:2; }

.board {
  grid-column:3;
  padding:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.actions { grid-column:4; }

h2 {
  margin:0 0 10px;
  color:#40565a;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.step {
  width:100%;
  padding:9px 8px;
  text-align:left;
  border:0;
  border-bottom:1px solid #dce4e1;
  background:transparent;
  color:var(--ink);
  cursor:pointer;
}

.step:hover { background:#f0f6f3; }

.step:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:-2px;
}

.step.active {
  padding-left:5px;
  border-left:3px solid var(--accent);
  background:#dcefe7;
}

.step small {
  display:block;
  margin-top:3px;
  overflow:hidden;
  color:var(--muted);
  white-space:nowrap;
  text-overflow:ellipsis;
}

.step-player {
  font-weight:700;
}

.step-player.p0 { color:var(--p0); }
.step-player.p1 { color:var(--p1); }
.step-player.p2 { color:var(--p2); }
.step-player.p3 { color:var(--p3); }

.round-separator {
  height:24px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#82908e;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.round-separator::before,
.round-separator::after {
  content:"";
  height:1px;
  background:#c8d2cf;
}

.round-separator::before { width:10px; }
.round-separator::after { flex:1; }

.round-separator span { white-space:nowrap; }

.board-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:7px;
  flex-shrink:0;
}

.legend {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
  color:var(--muted);
  font-size:10px;
}

.legend i {
  display:inline-block;
  width:18px;
  margin-right:3px;
  border-top:3px solid var(--rail);
  vertical-align:middle;
}

.legend i.canal {
  border-color:var(--canal);
  border-top-style:dashed;
}

.legend i.rail {
  border-color:var(--rail);
}

.player-key {
  font-weight:700;
}

.player-key.p0 { color:var(--p0); }
.player-key.p1 { color:var(--p1); }
.player-key.p2 { color:var(--p2); }
.player-key.p3 { color:var(--p3); }

.map-wrap {
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:1px solid var(--line);
  background:#edf3ef;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.55),
    0 1px 3px rgba(30,50,50,.08);
  display:flex;
  align-items:center;
  justify-content:center;
}

.map {
  display:block;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
}

.route-underlay {
  fill:none;
  stroke:#26373b;
  stroke-width:10;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.72;
  pointer-events:none;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
}

.route {
  fill:none;
  stroke:#8e9d9a;
  stroke-width:2.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.48;
  pointer-events:stroke;
  transition:stroke-width .12s,opacity .12s;
}

.route.cap-canal {
  stroke-dasharray:9 6;
}

.route.cap-rail {
  stroke-dasharray:none;
}

.route.used {
  stroke-width:6;
  opacity:1;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.38));
}

.route.used.cap-canal {
  stroke-dasharray:10 6;
}

.route.used.cap-rail {
  stroke-dasharray:none;
}

.route.p0 { stroke:var(--p0); }
.route.p1 { stroke:var(--p1); }
.route.p2 { stroke:var(--p2); }
.route.p3 { stroke:var(--p3); }

.route-owner {
  pointer-events:none;
}

.route-owner circle {
  stroke:#fff;
  stroke-width:2;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));
}

.route-owner text {
  fill:#fff;
  font-size:8px;
  font-weight:800;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:rgba(0,0,0,.35);
  stroke-width:2px;
}

.route-owner.p0 circle { fill:var(--p0); }
.route-owner.p1 circle { fill:var(--p1); }
.route-owner.p2 circle { fill:var(--p2); }
.route-owner.p3 circle { fill:var(--p3); }

.city {
  cursor:default;
}

.city-boundary {
  fill:#f1f5f3;
  fill-opacity:.98;
  stroke:#65777a;
  stroke-width:2;
  rx:13;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));
  pointer-events:none;
}

.city-effect .city-boundary {
  stroke:#d97706;
  stroke-width:5;
  filter:drop-shadow(0 0 5px rgba(217,119,6,.75));
}

.city-slot.effect-target {
  stroke:#d97706 !important;
  stroke-width:5 !important;
  filter:drop-shadow(0 0 5px rgba(217,119,6,.75));
}

.farm-effect {
  stroke:#d97706 !important;
  stroke-width:5 !important;
  filter:drop-shadow(0 0 5px rgba(217,119,6,.75));
}

.farm-city .city-boundary {
  fill:#f1f5f3;
  fill-opacity:.98;
  stroke:#65777a;
  stroke-width:2;
  rx:13;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));
  pointer-events:none;
}

.farm-city .city-boundary-inner {
  fill:none;
  stroke:rgba(255,255,255,.9);
  stroke-width:1;
  rx:11;
  pointer-events:none;
}

.farm-city .city-slot {
  pointer-events:none;
}

.farm-site {
  fill:#f5fbf7;
  stroke:#65777a;
  stroke-width:2;
  rx:8;
}

.farm-site.occupied.p0 { stroke:var(--p0); }
.farm-site.occupied.p1 { stroke:var(--p1); }
.farm-site.occupied.p2 { stroke:var(--p2); }
.farm-site.occupied.p3 { stroke:var(--p3); }
.farm-site-title { font-size:9px; font-weight:700; text-anchor:middle; }
.farm-site-info { font-size:8px; text-anchor:middle; }

.route.effect-target {
  stroke:#d97706 !important;
  stroke-width:10 !important;
  opacity:1 !important;
  filter:drop-shadow(0 0 4px rgba(217,119,6,.8));
}

.city-boundary-inner {
  fill:none;
  stroke:rgba(255,255,255,.9);
  stroke-width:1;
  rx:11;
  pointer-events:none;
}

.city-name {
  fill:var(--ink);
  font-size:14px;
  font-weight:800;
  text-anchor:middle;
  paint-order:stroke;
  stroke:#edf3ef;
  stroke-width:5px;
  stroke-linejoin:round;
}

.city-slots {
  pointer-events:none;
}

.city-slot {
  fill:#d7dfdc;
  stroke:#52676a;
  stroke-width:1.7;
  rx:4;
}

.city-slot.occupied {
  stroke:#fff;
  stroke-width:2;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
}

.city-slot.p0 { fill:var(--p0); }
.city-slot.p1 { fill:var(--p1); }
.city-slot.p2 { fill:var(--p2); }
.city-slot.p3 { fill:var(--p3); }

.city-slot-title {
  fill:#fff;
  font-size:8px;
  font-weight:800;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
  paint-order:stroke;
  stroke:rgba(0,0,0,.35);
  stroke-width:1.5px;
}

.city-slot-level {
  fill:#fff;
  font-size:13px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
  paint-order:stroke;
  stroke:rgba(0,0,0,.35);
  stroke-width:2px;
}

.city-slot-info {
  fill:#fff;
  font-size:7px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
  paint-order:stroke;
  stroke:rgba(0,0,0,.4);
  stroke-width:1.2px;
}

.farm {
  fill:#d9e7df;
  stroke:#658478;
  stroke-width:2;
  stroke-dasharray:4 3;
}

.farm-name {
  fill:var(--ink);
  font-size:11px;
  font-weight:700;
  text-anchor:middle;
  paint-order:stroke;
  stroke:#edf3ef;
  stroke-width:4px;
}

.merchant-site {
  fill:#fff8e8;
  stroke:#a4772b;
  stroke-width:2;
  rx:7;
}

.merchant-site.used { fill:#f1eeee; stroke:#8b7777; }
.merchant-site-title { font-size:9px; font-weight:800; text-anchor:middle; }
.merchant-site-info { font-size:8px; text-anchor:middle; }

.stats {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:12px;
}

.stat {
  padding:7px;
  border:1px solid var(--line);
  border-radius:3px;
  background:#f4f8f5;
}

.stat b {
  display:block;
  font-size:16px;
}

.player {
  padding:8px 0;
  border-top:1px solid #dce4e1;
}

.player strong {
  display:inline-block;
  padding-left:7px;
  border-left:4px solid var(--p0);
}

.effect-line {
  margin: 4px 0;
  padding: 5px 8px;
  border-left: 3px solid var(--teal);
  background: #e8f4ef;
  color: #24584d;
}

.player.p1 strong { border-color:var(--p1); }
.player.p2 strong { border-color:var(--p2); }
.player.p3 strong { border-color:var(--p3); }

.hand {
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

td,th {
  padding:6px;
  border-bottom:1px solid #d9e0dd;
  text-align:left;
  vertical-align:top;
}

th {
  position:sticky;
  top:0;
  z-index:1;
  background:#f1f6f3;
  color:#486066;
}

th.sortable {
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}

th.sortable:hover {
  background:#e5efeb;
  color:var(--teal);
}

th.sortable .sort-icon {
  display:inline-block;
  width:12px;
  margin-left:3px;
  color:var(--accent);
  font-size:11px;
}

tr.sel {
  background:#dcefe7;
}

.canonical {
  max-width:340px;
  color:#617176;
  font-family:ui-monospace,Consolas,monospace;
  font-size:10px;
  word-break:break-all;
}

.muted {
  color:var(--muted);
}

.error {
  padding:7px;
  margin-bottom:8px;
  border:1px solid #f0c5c2;
  border-radius:3px;
  background:#fff0ef;
  color:#a72828;
}

@media (max-width:1200px) {
  .layout {
    grid-template-columns:185px 145px minmax(480px,1.5fr) minmax(300px,.9fr);
  }

  .legend {
    gap:5px;
    font-size:9px;
  }
}
</style>

<div class="top">
  <h1>Brass Replay</h1>
  <button id="step" onclick="one()">Step</button>
  <button id="run" onclick="toggle()">Run</button>
  <button onclick="pause();refresh()">Pause / Refresh</button>
  <span id="meta" class="meta"></span>
</div>

<main class="layout">
  <aside class="panel timeline">
    <h2>Timeline</h2>
    <div id="steps"></div>
  </aside>

  <aside class="panel right">
    <h2>Global / Players</h2>
    <div id="global"></div>
    <div id="players"></div>
  </aside>

  <section class="panel board">
    <div class="board-head">
      <h2>Board</h2>
      <div class="legend">
        <span><i></i>route</span>
        <span><i class="canal"></i>canal</span>
        <span><i class="rail"></i>rail</span>
        <span class="player-key p0">● P0</span>
        <span class="player-key p1">● P1</span>
        <span class="player-key p2">● P2</span>
        <span class="player-key p3">● P3</span>
      </div>
    </div>

    <div class="map-wrap">
      <svg id="map" class="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>

  <section class="panel actions">
    <h2>Legal Actions and Decision Evidence</h2>
    <div id="detail" class="muted">Select a generated step.</div>
    <div id="effect" class="muted"></div>
    <table>
      <thead id="actions-head">
        <tr>
          <th class="sortable" onclick="sortActions('action')">
            Action<span id="sort-action" class="sort-icon"></span>
          </th>
          <th>Canonical</th>
          <th class="sortable" onclick="sortActions('score')">
            Strategy score<span id="sort-score" class="sort-icon"></span>
          </th>
          <th>Card</th>
          <th>Card score</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="actions"></tbody>
    </table>
  </section>
</main>

<script>
const CITY_POS = {
  Belper:[750,60],
  Derby:[785,240],
  Leek:[520,40],
  StokeOnTrent:[290,80],
  Stone:[250,220],
  Uttoxeter:[515,240],
  Stafford:[330,340],
  BurtonOnTrent:[650,390],
  Cannock:[430,460],
  Tamworth:[730,545],
  Walsall:[500,580],
  Wolverhampton:[350,590],
  Coalbrookdale:[180,600],
  Dudley:[400,730],
  Kidderminster:[210,780],
  Worcester:[330,940],
  Birmingham:[610,780],
  Coventry:[850,865],
  Nuneaton:[850,650],
  Redditch:[595,960]
};

const CITY_KEYS = [
  'Belper','Derby','Leek','StokeOnTrent','Stone',
  'Uttoxeter','Stafford','BurtonOnTrent','Cannock',
  'Tamworth','Walsall','Wolverhampton','Coalbrookdale',
  'Dudley','Kidderminster','Worcester','Birmingham',
  'Coventry','Nuneaton','Redditch'
];

const SPECIAL_POS = {
  20:[25,610],
  21:[450,1000],
  22:[795,1000],
  23:[130,65],
  24:[950,220],
  25:[300,485],
  26:[230,880]
};

const SPECIAL_NAMES = {
  20:'Shrewsbury',
  21:'Gloucester',
  22:'Oxford',
  23:'Warrington',
  24:'Nottingham',
  25:'北部农场',
  26:'南部农场'
};

const POS = {
  ...Object.fromEntries(CITY_KEYS.map(k => [CITY_KEYS.indexOf(k),CITY_POS[k]])),
  ...SPECIAL_POS
};

let data;
let selected = -1;
let detail = null;
let running = false;
let stepInFlight = false;
let runTimer = 0;
let sortColumn = null;
let sortDirection = 1;
let boardSignature = '';
let timelineSignature = '';

const q = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g,m => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[m]));

const wait = ms => new Promise(resolve => setTimeout(resolve,ms));

async function refresh() {
  const response = await fetch('/api/status');
  if (!response.ok) throw new Error(`status ${response.status}`);
  data = await response.json();
  render();
}

async function one() {
  if (stepInFlight || data?.failure || data?.complete) return;

  stepInFlight = true;
  render();

  try {
    const response = await fetch('/api/step',{method:'POST'});

    if (response.status === 409) {
      data = await response.json();
      return;
    }

    if (response.status !== 202) {
      throw new Error(`step ${response.status}`);
    }

    await wait(30);

    do {
      await refresh();
      if (data.busy) await wait(20);
    } while (data.busy);

  } catch (error) {
    q('#detail').className = 'error';
    q('#detail').textContent = `Request failed: ${error.message}`;
  } finally {
    stepInFlight = false;
    render();
  }
}

function pause() {
  running = false;
  clearTimeout(runTimer);
  q('#run').textContent = 'Run';
}

async function runNext() {
  if (!running) return;

  await one();

  if (running && !data?.failure && !data?.complete) {
    runTimer = setTimeout(runNext,20);
  } else {
    pause();
  }
}

function toggle() {
  if (running) {
    pause();
    return;
  }

  running = true;
  q('#run').textContent = 'Pause';
  runNext();
}

async function choose(i, focus = false) {
  selected = i;
  detail = null;
  render();

  try {
    const response = await fetch(`/api/steps/${i}`);
    if (!response.ok) throw new Error(`step ${response.status}`);
    detail = await response.json();
    render();
  } catch (error) {
    q('#detail').className = 'error';
    q('#detail').textContent = `Cannot load step: ${error.message}`;
  } finally {
    if (focus) q(`#steps .step[data-step-index="${i}"]`)?.focus();
  }
}

function sortActions(column) {
  if (!detail?.legal_actions?.length) return;

  if (sortColumn === column) {
    sortDirection *= -1;
  } else {
    sortColumn = column;
    sortDirection = column === 'score' ? -1 : 1;
  }

  renderActions();
}

function renderActions() {
  if (detail?.kind === 'era_end') {
    q('#actions-head').innerHTML = `
      <tr><th>玩家</th><th>产业 VP</th><th>连接 VP</th><th>结算前 → 结算后</th></tr>
    `;

    q('#actions').innerHTML = (detail.score_breakdown || []).map(s => `
      <tr>
        <td>P${s.player}</td>
        <td>+${s.industry_vp}</td>
        <td>+${s.link_vp}</td>
        <td>${s.previous_vp} → <b>${s.total_vp}</b></td>
      </tr>
    `).join('');

    return;
  }

  const evidenceKind = detail?.trace?.evidence_kind || '';
  const scoreHeader =
    evidenceKind === 'net-mcts' || evidenceKind === 'mcts-root-visits' ? 'Root visits'
    : evidenceKind === 'net-policy' ? 'Policy prob'
    : 'Strategy score';

  q('#actions-head').innerHTML = `
    <tr>
      <th class="sortable" onclick="sortActions('action')">
        Action<span id="sort-action" class="sort-icon"></span>
      </th>
      <th>Canonical</th>
      <th class="sortable" onclick="sortActions('score')">
        ${scoreHeader}<span id="sort-score" class="sort-icon"></span>
      </th>
      <th>Card</th>
      <th>Card score</th>
      <th>Status</th>
    </tr>
  `;

  const actions = detail?.legal_actions || [];
  const sorted = [...actions];

  if (sortColumn === 'action') {
    sorted.sort((a,b) => {
      const av = String(a.description || '');
      const bv = String(b.description || '');

      return av.localeCompare(
        bv,
        undefined,
        {
          numeric:true,
          sensitivity:'base'
        }
      ) * sortDirection;
    });
  }

  if (sortColumn === 'score') {
    sorted.sort((a,b) => {
      const aValid =
        typeof a.score === 'number' &&
        Number.isFinite(a.score);

      const bValid =
        typeof b.score === 'number' &&
        Number.isFinite(b.score);

      if (aValid !== bValid) return aValid ? -1 : 1;
      if (!aValid) return 0;

      return (a.score - b.score) * sortDirection;
    });
  }

  q('#sort-action').textContent =
    sortColumn === 'action'
      ? (sortDirection > 0 ? '↑' : '↓')
      : '';

  q('#sort-score').textContent =
    sortColumn === 'score'
      ? (sortDirection > 0 ? '↑' : '↓')
      : '';

  q('#actions').innerHTML = sorted.map(a => `
    <tr class="${a.selected ? 'sel' : ''}">
      <td>${esc(a.description)}</td>
      <td class="canonical">${esc(a.canonical)}</td>
      <td>${a.score ?? 'not evaluated'}</td>
      <td>${esc(a.card || 'scout/discard set')}</td>
      <td>${a.card_score ?? 'not evaluated'}</td>
      <td>${a.selected
        ? `selected${a.note ? ` · ${esc(a.note)}` : ''}`
        : esc(a.note || '')}</td>
    </tr>
  `).join('');
}

function stepEffects(step) {
  if (!step || step.kind !== 'action') return [];

  const beforeTiles = Object.fromEntries(step.before.tiles.map(t => [t.place, t]));
  const afterTiles = Object.fromEntries(step.after.tiles.map(t => [t.place, t]));
  const effects = [];

  for (const [place, tile] of Object.entries(afterTiles)) {
    const old = beforeTiles[place];

    if (!old) {
      effects.push(`建造：${place} · ${tile.industry} Lv${tile.level}`);
    } else if (old.flipped !== tile.flipped || old.level !== tile.level) {
      effects.push(`产业变化：${place} · ${old.industry} → ${tile.industry} Lv${tile.level}${tile.flipped ? '（已翻面）' : ''}`);
    }
  }

  for (const old of step.before.tiles) {
    if (!afterTiles[old.place]) {
      effects.push(`移除：${old.place} · ${old.industry}`);
    }
  }

  const cityName = id =>
    step.before.cities.find(c => c.id === id)?.name ||
    `地点${id}`;

  step.after.routes.forEach((route, i) => {
    const old = step.before.routes[i];

    if (old && old.owner == null && route.owner != null) {
      effects.push(`铺设${route.kind === 'rail' ? '铁路' : '水路'}：${cityName(route.a)} ↔ ${cityName(route.b)}`);
    }
  });

  return effects;
}

function effectTargets(step) {
  const result = {
    slots:new Map(),
    farms:false,
    routes:new Set()
  };

  if (!step || step.kind !== 'action') return result;

  const beforeTiles =
    Object.fromEntries(step.before.tiles.map(t => [t.place,t]));

  for (const tile of step.after.tiles) {
    const old = beforeTiles[tile.place];

    if (!old || old.flipped !== tile.flipped || old.level !== tile.level) {
      if (tile.place.startsWith('Farm #')) {
        result.farms = true;
      } else {
        const match = tile.place.match(/^(.*) #(\d+)$/);

        if (match) {
          if (!result.slots.has(match[1])) {
            result.slots.set(match[1],new Set());
          }

          result.slots.get(match[1]).add(Number(match[2]) - 1);
        }
      }
    }
  }

  step.after.routes.forEach((route,i) => {
    const old = step.before.routes[i];

    if (old && old.owner == null && route.owner != null) {
      result.routes.add(i);
    }
  });

  return result;
}

document.addEventListener('keydown', event => {
  if (
    event.key !== 'ArrowUp' &&
    event.key !== 'ArrowDown' &&
    event.key !== 'w' &&
    event.key !== 's'
  ) return;

  if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
  if (!data?.steps?.length) return;

  event.preventDefault();

  const delta =
    event.key === 'ArrowDown' || event.key === 's'
      ? 1
      : event.key === 'ArrowUp' || event.key === 'w'
      ? -1
      : 0;

  const next =
    selected < 0
      ? (delta > 0 ? 0 : data.steps.length - 1)
      : Math.max(
          0,
          Math.min(
            data.steps.length - 1,
            selected + delta
          )
        );

  if (next !== selected) {
    choose(next,true);
  }
});

function getSlotLayout(count) {
  const width = 48;
  const height = 48;
  const gap = 5;

  if (count <= 1) {
    return {
      width,
      height,
      columns:1,
      rows:1,
      positions:[[0,0]]
    };
  }

  if (count === 2) {
    return {
      width,
      height,
      columns:2,
      rows:1,
      positions:[
        [0,0],
        [width+gap,0]
      ]
    };
  }

  if (count === 3) {
    return {
      width,
      height,
      columns:2,
      rows:2,
      positions:[
        [width/2+gap/2,0],
        [0,height+gap],
        [width+gap,height+gap]
      ]
    };
  }

  return {
    width,
    height,
    columns:2,
    rows:2,
    positions:[
      [0,0],
      [width+gap,0],
      [0,height+gap],
      [width+gap,height+gap]
    ]
  };
}

// 煤/铁/酒的资源耗尽即翻面，二者互斥；其余产业无资源概念，只标注翻面。
function slotInfoText(slot) {
  if (!slot) return '';

  if (['煤矿', '铁厂', '啤酒厂'].includes(slot.industry)) {
    return (slot.resources ?? 0) > 0 ? `资源 ${slot.resources}` : '已翻面';
  }

  return slot.flipped ? '已翻面' : '';
}

function slotMarkup(slot,index,layout) {
  const [x,y] = layout.positions[index];

  const occupied = slot.occupied;

  const owner =
    occupied && slot.owner != null
      ? `p${slot.owner}`
      : '';

  const industry =
    occupied
      ? String(slot.industry || '').replace(/\_/g,' ')
      : '空置';

  const level =
    occupied
      ? `L${slot.level ?? '-'}`
      : '';

  const resource =
    occupied
      ? slotInfoText(slot)
      : '';

  const allowed =
    (slot.allowed || []).join(' / ');

  return `
    <g
      data-city-slot="${index}"
      transform="translate(${x},${y})"
    >
      <rect
        class="city-slot ${occupied ? 'occupied' : ''} ${owner}"
        width="${layout.width}"
        height="${layout.height}"
      />

      <text
        class="city-slot-title"
        x="${layout.width / 2}"
        y="13"
      >${esc(industry)}</text>

      ${occupied ? `
        <text
          class="city-slot-level"
          x="${layout.width / 2}"
          y="28"
        >${esc(level)}</text>

        <text
          class="city-slot-info"
          x="${layout.width / 2}"
          y="41"
        >${esc(resource)}</text>
      ` : ''}

      <title>
槽位 ${index + 1}（${esc(allowed)}）
${occupied
  ? `P${slot.owner} · ${slot.industry} · L${slot.level} · ${slot.flipped ? '已翻面' : '未翻面'} · 资源 ${slot.resources ?? 0}`
  : '空置'}
      </title>
    </g>
  `;
}

function routeKey(a,b) {
  return a < b
    ? `${a}:${b}`
    : `${b}:${a}`;
}

function routeGeometry(routes,index) {
  const r = routes[index];

  const a = POS[r.a];
  const b = POS[r.b];

  if (!a || !b) return null;

  const [x1,y1] = a;
  const [x2,y2] = b;

  const key = routeKey(r.a,r.b);

  const group = routes
    .map((x,i) => ({x,i}))
    .filter(v =>
      routeKey(v.x.a,v.x.b) === key
    );

  const groupIndex =
    group.findIndex(v => v.i === index);

  const groupOffset =
    (groupIndex - (group.length - 1) / 2) * 12;

  const dx = x2 - x1;
  const dy = y2 - y1;

  const len =
    Math.hypot(dx,dy) || 1;

  const nx = -dy / len;
  const ny = dx / len;

  const mx = (x1+x2)/2;
  const my = (y1+y2)/2;

  const bend =
    groupOffset + 8;

  const cx =
    mx + nx * bend;

  const cy =
    my + ny * bend;

  const px =
    (x1 + 2*cx + x2) / 4;

  const py =
    (y1 + 2*cy + y2) / 4;

  return {
    d:`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`,
    ownerX:px,
    ownerY:py
  };
}

function drawBoard(
  state,
  targets = {
    cities:new Set(),
    farms:false,
    routes:new Set()
  }
) {
  const signature =
    state.routes
      .map(r =>
        `${r.a},${r.b},${r.canal ? 1 : 0},${r.rail ? 1 : 0}`
      )
      .join('|') +
    '||' +
    state.cities
      .map(c =>
        `${c.id}:${c.name}:${(c.slots || []).length}`
      )
      .join('|') +
    '||' +
    (state.merchants || [])
      .map(m =>
        `${m.loc}:${m.buys}:${m.has_beer ? 1 : 0}`
      )
      .join('|') +
    '||' +
    (state.tiles || [])
      .filter(t => t.place === 'Farm #1' || t.place === 'Farm #2')
      .map(t =>
        `${t.place}:${t.owner}:${t.industry}:${t.level}:${t.resources}:${t.flipped ? 1 : 0}`
      )
      .join('|');

  const svg = q('#map');

  if (signature !== boardSignature) {
    boardSignature = signature;

    const byId =
      Object.fromEntries(
        state.cities.map(c => [c.id,c])
      );

    const cityName =
      id =>
        byId[id]?.name ||
        SPECIAL_NAMES[id] ||
        '';

    let out =
      '<rect width="1000" height="1000" fill="#edf3ef"/>';

    for (const [index,r] of state.routes.entries()) {
      const geometry =
        routeGeometry(state.routes,index);

      if (!geometry) continue;

      const routeClass = [
        'route',
        r.canal ? 'cap-canal' : '',
        r.rail ? 'cap-rail' : ''
      ]
        .filter(Boolean)
        .join(' ');

      const title =
        `${cityName(r.a)} - ${cityName(r.b)}`;

      if (r.owner != null) {
        out += `
          <path
            class="route-underlay"
            data-route-underlay="${index}"
            d="${geometry.d}"
          />
        `;
      }

      out += `
        <path
          class="${routeClass}"
          data-route="${index}"
          d="${geometry.d}"
        >
          <title>${esc(title)}</title>
        </path>
      `;

      if (r.owner != null) {
        out += `
          <g
            class="route-owner p${r.owner}"
            data-route-owner="${index}"
            transform="translate(${geometry.ownerX},${geometry.ownerY})"
          >
            <circle r="9"/>
            <text>P${r.owner}</text>
          </g>
        `;
      }
    }

    for (const c of state.cities) {
      const p = POS[c.id];

      if (!p) continue;

      const slots = c.slots || [];
      const layout = getSlotLayout(slots.length);

      const totalWidth =
        layout.columns === 1
          ? layout.width
          : layout.width * 2 + 5;

      const totalHeight =
        layout.rows === 1
          ? layout.height
          : layout.height * 2 + 5;

      const borderPaddingX = 12;
      const borderPaddingY = 12;

      const borderX =
        -totalWidth / 2 - borderPaddingX;

      const borderY =
        -totalHeight / 2 - borderPaddingY;

      const borderWidth =
        totalWidth + borderPaddingX * 2;

      const borderHeight =
        totalHeight + borderPaddingY * 2;

      const startX =
        -totalWidth / 2;

      const startY =
        -totalHeight / 2;

      out += `
        <g
          class="city"
          data-city="${c.id}"
          transform="translate(${p[0]},${p[1]})"
        >
          <rect
            class="city-boundary"
            x="${borderX}"
            y="${borderY}"
            width="${borderWidth}"
            height="${borderHeight}"
          />

          <rect
            class="city-boundary-inner"
            x="${borderX + 3}"
            y="${borderY + 3}"
            width="${borderWidth - 6}"
            height="${borderHeight - 6}"
          />

          <text
            class="city-name"
            y="${borderY - 7}"
          >${esc(c.name)}</text>

          <g
            class="city-slots"
            transform="translate(${startX},${startY})"
          >
            ${slots
              .map((slot,index) =>
                slotMarkup(slot,index,layout)
              )
              .join('')}
          </g>
        </g>
      `;
    }

    for (const [id,name] of Object.entries(SPECIAL_NAMES)) {
      const p = POS[id];

      if (!p) continue;

      const merchantEntries = Number(id) < 25
        ? (state.merchants || []).filter(m => m.loc === Number(id))
        : [];

      const farmIndex =
        id === '25'
          ? 0
          : id === '26'
          ? 1
          : -1;

      const farmTile =
        farmIndex >= 0
          ? state.tiles.find(
              t => t.place === `Farm #${farmIndex + 1}`
            )
          : null;

      const farmSlot =
        farmIndex >= 0
          ? {
              occupied:Boolean(farmTile),
              owner:farmTile?.owner,
              industry:farmTile?.industry || 'Beer',
              level:farmTile?.level,
              resources:farmTile?.resources,
              flipped:farmTile?.flipped,
              allowed:['Beer']
            }
          : null;

      const merchantMarker = merchantEntries.length
        ? `
          <rect
            class="merchant-site ${merchantEntries.every(m => m.buys === '空置' || !m.has_beer) ? 'used' : ''}"
            x="-48"
            y="-25"
            width="96"
            height="50"
          />
          <text class="merchant-site-title" y="-10">${esc(name)}</text>
          <text class="merchant-site-info" y="3">${esc(merchantEntries.map(m => m.buys).join(' / '))}</text>
          <text class="merchant-site-info" y="15">${esc(merchantEntries.map(m => m.buys === '空置' ? '无啤酒' : m.has_beer ? '啤酒在' : '啤酒已用').join(' / '))}</text>
        `
        : farmIndex >= 0
        ? `
          <g
            class="farm-city"
            data-farm-index="${farmIndex}"
          >
            <rect
              class="city-boundary"
              x="-42"
              y="-42"
              width="84"
              height="84"
            />

            <rect
              class="city-boundary-inner"
              x="-39"
              y="-39"
              width="78"
              height="78"
            />

            <text
              class="city-name"
              y="-51"
            >${esc(name)}</text>

            <g
              class="city-slots"
              transform="translate(-24,-24)"
            >
              ${slotMarkup(
                farmSlot,
                0,
                {
                  width:48,
                  height:48,
                  columns:1,
                  rows:1,
                  positions:[[0,0]]
                }
              )}
            </g>
          </g>
        `
        : `
          <circle class="farm" r="10"/>
          <text class="farm-name" y="-15">${esc(name)}</text>
        `;

      out += `
        <g
          class="city"
          data-farm="${esc(name)}"
          transform="translate(${p[0]},${p[1]})"
        >
          ${merchantMarker}
          ${
            merchantEntries.length
              ? `
                <title>
                  ${esc(
                    merchantEntries
                      .map(m =>
                        `${m.buys} · ${m.buys === '空置'
                          ? '无啤酒'
                          : m.has_beer
                          ? '啤酒在'
                          : '啤酒已用'}`
                      )
                      .join('；')
                  )}
                </title>
              `
              : farmIndex >= 0
              ? `
                <title>
                  ${esc(name)} · Beer · ${farmTile ? `L${farmTile.level}` : '空置'}
                </title>
              `
              : ''
          }
        </g>
      `;
    }

    svg.innerHTML = out;
  }

  for (const [index,r] of state.routes.entries()) {
    const line =
      svg.querySelector(
        `[data-route="${index}"]`
      );

    const underlay =
      svg.querySelector(
        `[data-route-underlay="${index}"]`
      );

    const owner =
      svg.querySelector(
        `[data-route-owner="${index}"]`
      );

    if (!line) continue;

    const ownerClass =
      r.owner != null
        ? `p${r.owner}`
        : '';

    line.setAttribute(
      'class',
      [
        'route',
        r.owner != null ? 'used' : '',
        ownerClass,
        r.canal ? 'cap-canal' : '',
        r.rail ? 'cap-rail' : ''
      ]
        .filter(Boolean)
        .join(' ')
    );

    if (r.owner != null) {
      if (!underlay) {
        const geometry =
          routeGeometry(state.routes,index);

        if (geometry) {
          const underlayNode =
            document.createElementNS(
              'http://www.w3.org/2000/svg',
              'path'
            );

          underlayNode.setAttribute(
            'class',
            'route-underlay'
          );

          underlayNode.dataset.routeUnderlay =
            index;

          underlayNode.setAttribute(
            'd',
            geometry.d
          );

          svg.insertBefore(
            underlayNode,
            line
          );
        }
      }

      let currentOwner =
        svg.querySelector(
          `[data-route-owner="${index}"]`
        );

      if (!currentOwner) {
        const geometry =
          routeGeometry(state.routes,index);

        if (geometry) {
          currentOwner =
            document.createElementNS(
              'http://www.w3.org/2000/svg',
              'g'
            );

          currentOwner.setAttribute(
            'class',
            `route-owner p${r.owner}`
          );

          currentOwner.dataset.routeOwner =
            index;

          currentOwner.setAttribute(
            'transform',
            `translate(${geometry.ownerX},${geometry.ownerY})`
          );

          currentOwner.innerHTML =
            '<circle r="9"/><text></text>';

          line.after(currentOwner);
        }
      }

      if (currentOwner) {
        const geometry =
          routeGeometry(state.routes,index);

        currentOwner.setAttribute(
          'class',
          `route-owner p${r.owner}`
        );

        if (geometry) {
          currentOwner.setAttribute(
            'transform',
            `translate(${geometry.ownerX},${geometry.ownerY})`
          );
        }

        currentOwner
          .querySelector('text')
          .textContent =
          `P${r.owner}`;
      }
    } else {
      if (underlay) underlay.remove();
      if (owner) owner.remove();
    }
  }

  for (const c of state.cities) {
    const city =
      svg.querySelector(
        `[data-city="${c.id}"]`
      );

    if (!city) continue;

    const slots = c.slots || [];

    slots.forEach((slot,index) => {
      const node =
        city.querySelector(
          `[data-city-slot="${index}"]`
        );

      if (!node) return;

      const occupied =
        slot.occupied;

      const ownerClass =
        occupied && slot.owner != null
          ? `p${slot.owner}`
          : '';

      const rect =
        node.querySelector('.city-slot');

      if (!rect) return;

      rect.setAttribute(
        'class',
        [
          'city-slot',
          occupied ? 'occupied' : '',
          ownerClass
        ]
          .filter(Boolean)
          .join(' ')
      );

      const title =
        node.querySelector(
          '.city-slot-title'
        );

      const level =
        node.querySelector(
          '.city-slot-level'
        );

      const info =
        node.querySelector(
          '.city-slot-info'
        );

      if (title) {
        title.textContent =
          occupied
            ? String(
                slot.industry || ''
              ).replace(/\_/g,' ')
            : String(
                slot.allowed || []
              ).replace(/,/g,' / ') ||
              '空置';
      }

      if (level) {
        level.textContent =
          occupied
            ? `L${slot.level ?? '-'}`
            : '';
      }

      if (info) {
        info.textContent =
          occupied
            ? slotInfoText(slot)
            : '';
      }

      const allowed =
        (slot.allowed || []).join(' / ');

      node.querySelector('title').textContent =
        `槽位 ${index + 1}（${allowed}）\n` +
        (
          occupied
            ? `P${slot.owner} · ${slot.industry} · L${slot.level} · ${slot.flipped ? '已翻面' : '未翻面'} · 资源 ${slot.resources ?? 0}`
            : '空置'
        );
    });
  }

  for (const [farmIndex,farmNumber] of [[0,1],[1,2]]) {
    const farmTile =
      state.tiles.find(
        t => t.place === `Farm #${farmNumber}`
      );

    const farm =
      svg.querySelector(
        `[data-farm-index="${farmIndex}"]`
      );

    if (!farm) continue;

    const node =
      farm.querySelector('[data-city-slot="0"]');

    if (!node) continue;

    const rect =
      node.querySelector('.city-slot');

    const title =
      node.querySelector('.city-slot-title');

    const level =
      node.querySelector('.city-slot-level');

    const info =
      node.querySelector('.city-slot-info');

    const occupied =
      Boolean(farmTile);

    const ownerClass =
      occupied && farmTile.owner != null
        ? `p${farmTile.owner}`
        : '';

    rect.setAttribute(
      'class',
      [
        'city-slot',
        occupied ? 'occupied' : '',
        ownerClass
      ]
        .filter(Boolean)
        .join(' ')
    );

    if (title) {
      title.textContent =
        occupied
          ? String(
              farmTile.industry || 'Beer'
            ).replace(/\_/g,' ')
          : 'Beer';
    }

    if (level) {
      level.textContent =
        occupied
          ? `L${farmTile.level ?? '-'}`
          : '';
    }

    if (info) {
      info.textContent =
        occupied
          ? slotInfoText(farmTile)
          : '';
    }

    node.querySelector('title').textContent =
      occupied
        ? `槽位 1（Beer）\nP${farmTile.owner} · ${farmTile.industry} · L${farmTile.level} · ${farmTile.flipped ? '已翻面' : '未翻面'} · 资源 ${farmTile.resources ?? 0}`
        : '槽位 1（Beer）\n空置';
  }

  svg.querySelectorAll(
    '.city-effect, .effect-target, .farm-effect'
  ).forEach(node => {
    node.classList.remove(
      'city-effect',
      'effect-target',
      'farm-effect'
    );
  });

  state.cities.forEach(city => {
    const slots = [...targets.slots.entries()]
      .find(([name]) =>
        name === city.name ||
        name.startsWith(city.name) ||
        city.name.startsWith(name)
      )?.[1];

    if (!slots) return;

    const node =
      svg.querySelector(
        `[data-city="${city.id}"]`
      );

    slots.forEach(index => {
      node
        ?.querySelector(
          `[data-city-slot="${index}"] .city-slot`
        )
        ?.classList.add('effect-target');
    });
  });

  if (targets.farms) {
    svg
      .querySelectorAll(
        '[data-farm] [data-city-slot="0"] .city-slot'
      )
      .forEach(node =>
        node.classList.add('farm-effect')
      );
  }

  targets.routes.forEach(index => {
    svg
      .querySelector(
        `[data-route="${index}"]`
      )
      ?.classList.add('effect-target');
  });
}

function renderTimeline() {
  const steps = q('#steps');

  const signature =
    data.steps
      .map((x,i) =>
        `${i}|${x.kind}|${x.player}|${x.round}|${x.strategy}|${x.chosen}|${x.era_event || ''}`
      )
      .join('||');

  if (signature !== timelineSignature) {
    timelineSignature = signature;

    steps.innerHTML =
      data.steps.map((x,i) => {
        const eraEnd =
          x.kind === 'era_end';

        const previous =
          data.steps[i - 1];

        const roundChanged =
          i > 0 &&
          x.kind === 'action' &&
          previous?.kind === 'action' &&
          x.round !== previous.round;

        const separator =
          roundChanged
            ? `<div class="round-separator"><span>Round ${x.round}</span></div>`
            : '';

        const label =
          eraEnd
            ? (
                x.era_event === 'final-scoring'
                  ? '铁路时代最终结算'
                  : '运河时代结束'
              )
            : `<span class="step-player p${x.player}">P${x.player}</span> · ${esc(x.strategy)}`;

        const detail =
          eraEnd
            ? '结算、清理与 VP 更新'
            : esc(x.chosen);

        return `
          ${separator}

          <button
            class="step"
            data-step-index="${i}"
            onclick="choose(${i})"
          >
            ${i+1}. ${label}
            <small>${detail}</small>
          </button>
        `;
      }).join('');
  }

  steps
    .querySelectorAll('.step')
    .forEach(button => {
      button.classList.toggle(
        'active',
        Number(button.dataset.stepIndex) === selected
      );
    });
}

function render() {
  if (!data) return;

  const step =
    detail && detail.index === selected
      ? detail
      : null;

  const state =
    step
      ? step.before
      : data.current;

  const boardState =
    step?.kind === 'era_end'
      ? step.before
      : state;

  const displayRound =
    step?.kind === 'action'
      ? step.before.round
      : state.round;

  q('#meta').textContent =
    `seed ${data.seed} · ${data.strategies.join(', ')}` +
    (
      data.busy
        ? ' · thinking…'
        : data.failure
          ? ' · '+data.failure
          : data.complete
            ? ' · complete'
            : ''
    );

  q('#step').disabled =
    stepInFlight ||
    data.busy ||
    data.complete ||
    Boolean(data.failure);

  renderTimeline();

  q('#global').innerHTML = `
    <div class="stats">
      <div class="stat">
        <b>${boardState.era.toUpperCase()}</b>
        时代
      </div>

      <div class="stat">
        <b>${displayRound}</b>
        轮次
      </div>

      <div class="stat">
        <b>P${state.current_player}</b>
        当前玩家
      </div>

      <div class="stat">
        <b>${state.deck}</b>
        牌堆剩余
      </div>

      <div class="stat">
        <b>${state.coal_market}</b>
        煤炭市场
      </div>

      <div class="stat">
        <b>${state.iron_market}</b>
        铁市场
      </div>
    </div>
  `;

  q('#players').innerHTML =
    state.players.map(p => `
      <div class="player p${p.id}">
        <strong>P${p.id}</strong>
        &nbsp;$${p.money}
        &nbsp;收入 ${p.income}
        &nbsp;VP ${p.vp}

        <div class="hand">
          ${p.hand.map(esc).join(' · ')}
        </div>
      </div>
    `).join('');

  drawBoard(
    boardState,
    effectTargets(step)
  );

  q('#detail').className =
    data.failure
      ? 'error'
      : 'muted';

  q('#detail').textContent =
    data.failure ||
    (
      step
        ? step.kind === 'era_end'
          ? `时代结束 · ${step.era_event} · VP: ${step.before.players
              .map((p,i) =>
                `P${i} ${p.vp}→${step.after.players[i]?.vp ?? p.vp}`
              )
              .join('，')}。`
          : `${step.trace.evidence_kind}${typeof step.trace.root_value === 'number' ? ` · 根价值 ${step.trace.root_value.toFixed(3)}` : ''} · ${step.result}`
        : selected >= 0
          ? 'Loading step…'
          : 'Select a generated step.'
    );

  q('#effect').innerHTML =
    stepEffects(step)
      .map(effect =>
        `<div class="effect-line">${esc(effect)}</div>`
      )
      .join('');

  renderActions();
}

refresh().catch(error => {
  q('#detail').className = 'error';

  q('#detail').textContent =
    `Cannot connect: ${error.message}`;
});
</script>
