[package]
name = "brass-engine"
version = "0.1.0"
edition = "2024"
description = "Brass: Birmingham game engine (Rust) - phase 1"

[lib]
name = "brass_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
